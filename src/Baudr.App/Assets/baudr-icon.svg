<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container squircle with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle grid pattern indicating timing ticks -->
  <g opacity="0.12" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 8">
    <line x1="120" y1="100" x2="120" y2="412" />
    <line x1="180" y1="100" x2="180" y2="412" />
    <line x1="240" y1="100" x2="240" y2="412" />
    <line x1="300" y1="100" x2="300" y2="412" />
    <line x1="360" y1="100" x2="360" y2="412" />
    <line x1="420" y1="100" x2="420" y2="412" />
  </g>

  <!-- The Baud Waveform: Digital UART pulse train forming the letter 'B' and baud transition -->
  <g filter="url(#glow)">
    <!-- Baseline guide / carrier -->
    <path d="M 80 340 L 140 340 L 140 180 L 220 180 L 220 340 L 280 340 L 280 230 L 340 230 L 340 340 L 432 340" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- High-frequency baud transition nodes -->
    <circle cx="140" cy="180" r="14" fill="#38BDF8"/>
    <circle cx="220" cy="180" r="14" fill="#00B4D8"/>
    <circle cx="280" cy="230" r="14" fill="#818CF8"/>
    <circle cx="340" cy="230" r="14" fill="#818CF8"/>
  </g>

  <!-- Stylized Terminal Prompt Chevron -->
  <path d="M 170 260 L 205 285 L 170 310" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.85"/>
</svg>

